name: Deploy to VPS
on:
  push:
    branches: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Dependency Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: SSH setup
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secret.SSH_KEY }}

      - name: Add host as known host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/tender-frontend/ \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules"

      - name: Connect to server and start service
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/tender-frontend
            yarn install --frozen-lockfile
            yarn build
            systemctl restart tender-frontend
          EOF
